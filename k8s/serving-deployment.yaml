apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-serving-deployment
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
    app: ml-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ml-serving
  template:
    metadata:
      labels:
        project: mlops-pytorch-pipeline
        app: ml-serving
    spec:
      containers:
        - name: ml-serving
          image: mlops-serve:v1
          #imagePullPolicy: IfNotPresent
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              # Training writes to the PVC's checkpoints/ subdirectory.
              # Mount the same subdirectory so the serving container sees classifer_v1.pt
              subPath: checkpoints
              readOnly: true
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: ml-training-pvc
            readOnly: true
